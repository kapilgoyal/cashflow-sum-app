# Build combined Vite + FastAPI image and push to GHCR.
# Windows/az imports ghcr.io/kapilgoyal/cashflow-sum-app:proto into cashflowacr
# when ACR Tasks is unavailable, then rolls the Container App.
name: Azure proto GHCR image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: azure-proto-ghcr
  cancel-in-progress: true

jobs:
  build:
    name: build-push-ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push proto image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kapilgoyal/cashflow-sum-app:proto
            ghcr.io/kapilgoyal/cashflow-sum-app:${{ github.sha }}
