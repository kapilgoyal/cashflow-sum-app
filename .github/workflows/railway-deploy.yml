# Deploy FastAPI to Railway project kind-emotion only.
#
# One-time setup:
#   1. Railway → open project **kind-emotion** (the 1/1 online one) → Settings → Tokens
#      → create a **Project Token** (must be from kind-emotion, not comfortable-contentment /
#      beautiful-tranquility / patient-illumination)
#   2. GitHub → Settings → Secrets → Actions → Name exactly: RAILWAY_TOKEN
#   3. Recommended: secret RAILWAY_SERVICE_ID = service name/id that serves
#      cashflow-sum-app-production.up.railway.app
name: Railway API deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: railway-api-kind-emotion
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy-kind-emotion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require RAILWAY_TOKEN (kind-emotion project token)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::error::Missing GitHub secret RAILWAY_TOKEN. Create a Project Token in Railway project kind-emotion and add it as Actions secret RAILWAY_TOKEN."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to kind-emotion (railway up)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          set -euo pipefail
          railway --version
          # Safe diagnostics (never echo token)
          railway whoami || true
          STATUS_OUT="$(railway status 2>&1 || true)"
          echo "$STATUS_OUT"

          # Fail fast if token is scoped to the wrong project.
          if echo "$STATUS_OUT" | grep -qi 'comfortable-contentment\|beautiful-tranquility\|patient-illumination'; then
            echo "::error::RAILWAY_TOKEN is scoped to the wrong Railway project (see status above). Replace the GitHub secret with a Project Token from kind-emotion only."
            exit 1
          fi
          if ! echo "$STATUS_OUT" | grep -qi 'kind-emotion'; then
            echo "::warning::Could not confirm project name kind-emotion in railway status. Continuing; set RAILWAY_SERVICE_ID if deploy fails."
          fi

          if [ -n "${RAILWAY_SERVICE_ID:-}" ]; then
            echo "Deploying with --service=${RAILWAY_SERVICE_ID}"
            railway up --ci --service "${RAILWAY_SERVICE_ID}"
          else
            # Prefer common service names for this API host.
            set +e
            for svc in cashflow-sum-app cashflow-api api web; do
              echo "Trying --service=${svc}"
              railway up --ci --service "$svc" && exit 0
            done
            echo "Retry: bare railway up --ci"
            railway up --ci
            exit $?
          fi
