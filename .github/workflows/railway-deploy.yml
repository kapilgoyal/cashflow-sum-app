# Deploy FastAPI to Railway project kind-emotion only (ignore crashed
# beautiful-tranquility / patient-illumination — disconnect those from GitHub).
#
# One-time setup:
#   1. Railway → open project kind-emotion → Settings → Tokens → Project Token
#   2. GitHub → Settings → Secrets and variables → Actions → New secret
#      Name (exact): RAILWAY_TOKEN
#      Value: that kind-emotion project token (never commit it)
#   3. Recommended secret RAILWAY_SERVICE_ID = service id/name that serves
#      cashflow-sum-app-production.up.railway.app (Settings → service → ID)
name: Railway API deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: railway-api-kind-emotion
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy-kind-emotion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require RAILWAY_TOKEN (kind-emotion project token)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::error::Missing GitHub secret RAILWAY_TOKEN. Create a Project Token in Railway project kind-emotion (Settings → Tokens) and add it as Actions secret RAILWAY_TOKEN. Do not use beautiful-tranquility or patient-illumination."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to kind-emotion (railway up)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          set -euo pipefail
          railway --version
          # Safe diagnostics (never echo token)
          railway whoami || true
          railway status || true

          deploy() {
            local svc="$1"
            if [ -n "$svc" ]; then
              echo "Deploying with --service=${svc}"
              railway up --ci --service "$svc"
            else
              echo "Deploying without --service (project default)"
              railway up --ci
            fi
          }

          if [ -n "${RAILWAY_SERVICE_ID:-}" ]; then
            deploy "${RAILWAY_SERVICE_ID}"
          else
            # Prefer explicit service when project has multiple; fall back.
            set +e
            deploy "cashflow-sum-app"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "Retry: bare railway up --ci"
              deploy ""
              rc=$?
            fi
            set -e
            exit "$rc"
          fi
