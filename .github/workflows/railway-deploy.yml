# Deploy FastAPI ONLY to Railway project kind-emotion.
#
# Required GitHub Actions secrets:
#   RAILWAY_TOKEN       — Project Token from kind-emotion (Settings → Tokens)
#   RAILWAY_SERVICE_ID  — service name or UUID that serves
#                         cashflow-sum-app-production.up.railway.app
#
# Do NOT omit RAILWAY_SERVICE_ID: a bare/fallback `railway up --service=web`
# previously uploaded to the wrong project (comfortable-contentment) while
# Action showed green and live cashflow-sum-app-production stayed stale.
name: Railway API deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: railway-api-kind-emotion
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy-kind-emotion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::error::Missing secret RAILWAY_TOKEN (kind-emotion Project Token)."
            exit 1
          fi
          if [ -z "${RAILWAY_SERVICE_ID}" ]; then
            echo "::error::Missing secret RAILWAY_SERVICE_ID. In Railway → kind-emotion → open the service with domain cashflow-sum-app-production.up.railway.app → copy service name or ID into GitHub secret RAILWAY_SERVICE_ID. Do not rely on a 'web' fallback."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to kind-emotion service only
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          set -euo pipefail
          railway --version
          railway whoami || true
          STATUS_OUT="$(railway status 2>&1 || true)"
          echo "$STATUS_OUT"

          if echo "$STATUS_OUT" | grep -qi 'Project is deleted'; then
            echo "::error::railway status says project is deleted / not linked. Recreate RAILWAY_TOKEN as a Project Token from kind-emotion (not a deleted project)."
            exit 1
          fi
          if echo "$STATUS_OUT" | grep -qi 'comfortable-contentment\|beautiful-tranquility\|patient-illumination'; then
            echo "::error::RAILWAY_TOKEN is scoped to a deleted/wrong project. Use a Project Token from kind-emotion only."
            exit 1
          fi
          if ! echo "$STATUS_OUT" | grep -qi 'kind-emotion'; then
            echo "::error::railway status did not show project kind-emotion. Fix RAILWAY_TOKEN (kind-emotion Project Token) before deploying."
            exit 1
          fi

          echo "Deploying with --service=${RAILWAY_SERVICE_ID}"
          railway up --ci --service "${RAILWAY_SERVICE_ID}"
