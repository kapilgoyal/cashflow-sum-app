# Fallback if builder is ever switched back to NIXPACKS.
# Critical: do NOT let Node/package.json win in this monorepo.
providers = ["python"]

[phases.setup]
nixPkgs = ["python312", "gcc"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
