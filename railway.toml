# Auto-rebuild when API sources change (GitHub-connected Railway service).
[build]
watchPatterns = [
  "app/**",
  "requirements.txt",
  "Dockerfile",
  "railway.toml",
  "Procfile",
  "nixpacks.toml",
  "api/**",
  ".github/workflows/railway-deploy.yml",
]

# startCommand must go through a shell so ${PORT} expands (Railway does not
# expand $PORT when exec'ing the command array directly).
[deploy]
startCommand = "sh -c 'python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
