# Prefer Nixpacks Python-only (nixpacks.toml providers). DOCKERFILE builds have been
# failing on Railway for this service while NIXPACKS/RAILPACK + uvicorn startCommand succeed.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
